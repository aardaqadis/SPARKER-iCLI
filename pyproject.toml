[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparker-icli"
version = "0.5.3"
description = "SPARKER iCLI — a minimal terminal image editor and command studio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
]
dependencies = ["textual>=8,<9", "Pillow>=12,<13"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1"]

[project.urls]
Repository = "https://github.com/aardaqadis/SPARKER-iCLI"
Issues = "https://github.com/aardaqadis/SPARKER-iCLI/issues"

[project.scripts]
sparker = "termatelier.__main__:main"
sparkericli = "termatelier.__main__:main"
termatelier = "termatelier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
termatelier = ["assets/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
