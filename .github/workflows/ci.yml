name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-tested.txt
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-tested.txt -e ".[test]" build
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Check the installed wheel
        run: python tools/check_wheel.py dist
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
